name: Оновити довідник

# Тягне ігрові дані з ClashKingAssets у теку data/, перевіряє їх на осудність
# і перезбирає слім-бандл data/ref.min.json, який читає сайт.
#
# Коміт робиться ТІЛЬКИ якщо змінилися самі таблиці. Раніше воркфлоу
# переписував дату в SOURCE.md і комітив щодня порожній diff — тепер
# свіжість живе в data/meta.json, який оновлюється разом із даними.

on:
  schedule:
    - cron: "0 4 * * *"      # щодня о 04:00 UTC
  workflow_dispatch:          # і вручну з вкладки Actions

permissions:
  contents: write

env:
  UPSTREAM: ClashKingInc/ClashKingAssets
  # Перелік має збігатися з FILES у tools/build_ref.py
  FILES: >-
    buildings traps troops spells heroes pets equipment helpers
    guardians magic_items decorations obstacles skins sceneries
    capital_house_parts

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Завантажити static_data у staging
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/$UPSTREAM/main/assets/static_data"
          mkdir -p .staging
          for f in $FILES; do
            echo "→ $f"
            curl -fsSL --retry 3 --retry-delay 2 "$BASE/$f.json" -o ".staging/$f.json"
          done

      - name: Зафіксувати походження
        id: upstream
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$UPSTREAM/commits?path=assets/static_data&per_page=1"
          curl -fsSL -H "Accept: application/vnd.github+json" "$API" -o .staging/commit.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open(".staging/commit.json"))[0]
          print("sha=" + c["sha"])
          print("date=" + c["commit"]["committer"]["date"])
          PY

      - name: Перевірити дані й зібрати бандл
        run: |
          set -euo pipefail
          python3 tools/build_ref.py \
            --src .staging --out .staging --prev data/meta.json \
            --upstream-sha "${{ steps.upstream.outputs.sha }}" \
            --upstream-date "${{ steps.upstream.outputs.date }}"

      - name: Порівняти з тим, що вже в репозиторії
        id: diff
        run: |
          set -euo pipefail
          changed=no
          for f in $FILES; do
            if ! cmp -s ".staging/$f.json" "data/$f.json" 2>/dev/null; then
              echo "змінилось: $f.json"
              changed=yes
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          [ "$changed" = "no" ] && echo "таблиці не змінилися — коміту не буде" || true

      - name: Перенести в data/ і закомітити
        if: steps.diff.outputs.changed == 'yes'
        run: |
          set -euo pipefail
          for f in $FILES; do cp ".staging/$f.json" "data/$f.json"; done
          cp .staging/ref.min.json .staging/meta.json data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "data: оновлення довідника $(date -u +%F)"
          git push

      - name: Прибрати staging
        if: always()
        run: rm -rf .staging
